# Temporary cleanup workflow; self-deletes after a successful patch.
name: One-shot payroll Clippy cleanup
on:
  push:
    branches:
      - work/accountant-daily-ops-20260925
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/accountant-daily-ops-20260925
          fetch-depth: 0
      - name: Apply staged cleanup
        run: python scripts/one_shot_clippy_patch.py
      - name: Commit cleanup
        shell: bash
        run: |
          rm scripts/one_shot_clippy_patch.py
          rm .github/workflows/one-shot-clippy-cleanup.yml
          git config user.name "pro-max-ci-repair"
          git config user.email "promaxfactory@gmail.com"
          git add src-tauri/src/commands/payroll.rs scripts/one_shot_clippy_patch.py .github/workflows/one-shot-clippy-cleanup.yml
          git diff --cached --check
          git commit -m "refactor: name payroll employee configuration fields"
          git push origin HEAD:work/accountant-daily-ops-20260925
