name: One-shot migration test repair

on:
  push:
    branches:
      - work/accountant-daily-ops-20260925

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/accountant-daily-ops-20260925
          fetch-depth: 0

      - name: Apply verified repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          db = Path("src-tauri/src/db.rs")
          text = db.read_text(encoding="utf-8")

          module_anchor = "}\n\n#[cfg(test)]\nmod tests {"
          helper = """    #[cfg(test)]
              pub(super) fn apply_migration_for_test(conn: &Connection, version: i32) -> Result<()> {
                  apply_migration(conn, version)
              }
          }\n\n#[cfg(test)]\nmod tests {"""
          if module_anchor not in text:
              raise SystemExit("db.rs migrations-module anchor not found")
          text = text.replace(module_anchor, helper, 1)

          test_marker = "fn test_migration_35_adds_company_profile_columns()"
          idx = text.find(test_marker)
          if idx < 0:
              raise SystemExit("migration 35 test marker not found")
          before, tail = text[:idx], text[idx:]
          old_comment = "// profile columns, then run the migration chain and verify they appear."
          new_comment = "// profile columns, then apply migration 35 directly and verify they appear."
          if old_comment not in tail:
              raise SystemExit("migration 35 comment anchor not found")
          tail = tail.replace(old_comment, new_comment, 1)
          old_call = 'super::migrations::run(&conn).expect("migrations must apply");'
          new_call = 'super::migrations::apply_migration_for_test(&conn, 35).expect("migration 35 must apply");'
          if old_call not in tail:
              raise SystemExit("migration 35 run call not found")
          tail = tail.replace(old_call, new_call, 1)
          db.write_text(before + tail, encoding="utf-8")

          exp = Path("src-tauri/src/commands/expenses.rs")
          etext = exp.read_text(encoding="utf-8")
          unused = '''    let source: Option<String> = tx
              .query_row("SELECT paid_from_source FROM expenses WHERE id=?1", [expense_id], |r| r.get(0))
              .unwrap_or_default();

          '''
          if unused not in etext:
              raise SystemExit("expenses unused-source anchor not found")
          etext = etext.replace(unused, "", 1)
          exp.write_text(etext, encoding="utf-8")

          Path(".github/workflows/one-shot-repair-112.yml").unlink()
          PY

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "pro-max-ci-repair"
          git config user.email "promaxfactory@gmail.com"
          git add src-tauri/src/db.rs src-tauri/src/commands/expenses.rs .github/workflows/one-shot-repair-112.yml
          git diff --cached --check
          git commit -m "fix: isolate migration 35 test and clear Rust warning"
          git push origin HEAD:work/accountant-daily-ops-20260925
