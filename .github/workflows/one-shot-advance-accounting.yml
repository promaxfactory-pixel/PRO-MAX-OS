name: One-shot employee advance accounting repair

on:
  push:
    branches:
      - work/accountant-daily-ops-20260925

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/accountant-daily-ops-20260925
          fetch-depth: 0
      - name: Apply staged patch
        run: python scripts/one_shot_advance_patch.py
      - name: Commit verified changes
        shell: bash
        run: |
          rm scripts/one_shot_advance_patch.py
          rm .github/workflows/one-shot-advance-accounting.yml
          git config user.name "pro-max-ci-repair"
          git config user.email "promaxfactory@gmail.com"
          git add src-tauri/src/commands/payroll.rs src-tauri/src/commands/reports.rs scripts/one_shot_advance_patch.py .github/workflows/one-shot-advance-accounting.yml
          git diff --cached --check
          git commit -m "fix: post employee advances and derive daily profit from GL"
          git push origin HEAD:work/accountant-daily-ops-20260925
