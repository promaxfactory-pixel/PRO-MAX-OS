name: CI

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-check:
    name: Rust Check & Test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Cargo check
        run: cargo check --lib --bins

      - name: Cargo test
        run: cargo test

      - name: Cargo clippy
        run: cargo clippy --lib --bins -- -D warnings

  typescript-check:
    name: TypeScript Check
    runs-on: windows-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint src/ --ext .ts,.tsx

      - name: Frontend tests
        run: npx vitest run

  # This deliberately creates an unsigned test installer. The bundled tracked
  # secrets file is a template; the application rejects it at runtime and
  # generates machine-local secrets beside its database on first run.
  # Release signing and updater artifacts remain a separate, key-controlled
  # process and must never rely on repository-tracked secret material.
  build-windows:
    name: Build Windows (manual)
    runs-on: windows-latest
    needs: [rust-check, typescript-check]
    if: github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci
        working-directory: .

      - name: Build frontend
        run: npm run build
        working-directory: .

      - name: Verify no real secret is bundled
        run: |
          $c = Get-Content promax.secrets.json -Raw
          if ($c -notmatch 'REPLACE_WITH') {
            Write-Error "CI may only bundle the tracked placeholder template; do not put real secrets in Git."
            exit 1
          }

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build unsigned Tauri installer
        run: cargo tauri build --config tauri.ci.conf.json
        working-directory: src-tauri

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: pro-max-os-installer-unsigned
          path: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
          retention-days: 30
